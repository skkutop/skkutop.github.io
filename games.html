<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Games — In progress</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Homepage">X_<span aria-hidden="true">.</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
        <span class="sr-only">Open navigation</span><span aria-hidden="true">Menu</span>
      </button>
      <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
        <a href="index.html#about">About</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#contact">Contact</a>
        <a class="games-link" href="games.html" aria-current="page">Games <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main class="game-page arcade-page">
      <p class="terminal-prompt" aria-hidden="true">arcade / player one</p>
      <h1>Snake protocol</h1>
      <p class="game-intro">Collect signal nodes. Avoid the wall and the roaming fault. Arrow keys, WASD, or the control pad steer the snake.</p>
      <section class="game-shell arcade-cabinet" aria-labelledby="game-title">
        <h2 id="game-title" class="sr-only">Snake game</h2>
        <div class="game-hud arcade-hud" aria-label="Game score board">
          <p>Score <strong id="score">0</strong></p>
          <p>Best <strong id="high-score">0</strong></p>
          <p id="game-status" role="status" aria-live="polite">Ready</p>
        </div>
        <canvas id="snake-board" width="480" height="480" aria-label="Snake game board. Use arrow keys, WASD, or the controls below to play."></canvas>
        <div class="game-actions arcade-actions">
          <button id="start-game" type="button">Start</button>
          <button id="pause-game" type="button" disabled>Pause</button>
          <button id="restart-game" type="button">Restart</button>
        </div>
        <div class="touch-controls" aria-label="Touch direction controls">
          <button type="button" data-direction="up" aria-label="Move up">↑</button>
          <button type="button" data-direction="left" aria-label="Move left">←</button>
          <button type="button" data-direction="down" aria-label="Move down">↓</button>
          <button type="button" data-direction="right" aria-label="Move right">→</button>
        </div>
      </section>
      <a class="text-action" href="index.html">Return home <span aria-hidden="true">←</span></a>
    </main>
  </body>
</html>
